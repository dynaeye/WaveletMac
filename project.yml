name: WaveletMac

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES

targets:
  WaveletMac:
    type: application
    platform: macOS
    sources:
      - path: WaveletMac
      - path: Shared/Models.swift
      - path: Shared/PersonalCatalog.swift
      - path: Shared/PersonalStationRepository.swift
      - path: Assets/WaveletAssets.xcassets
        buildPhase: resources
      - path: wavelet-logo-white3.png
        buildPhase: resources
      - path: Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mythmedia.waveletmac
        PRODUCT_NAME: Wavelet
        PRODUCT_MODULE_NAME: WaveletMac
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WaveletMac/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Wavelet
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        Release:
          DEVELOPMENT_TEAM: 2Z4FLDWWW9
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          ENABLE_TESTABILITY: NO
    scheme:
      testTargets:
        - WaveletMacTests


  WaveletMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WaveletMacTests
    dependencies:
      - target: WaveletMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mythmedia.waveletmac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wavelet.app/Contents/MacOS/Wavelet"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  WaveletMac:
    build:
      targets:
        WaveletMac: all
        WaveletMacTests: [test]
    test:
      targets:
        - WaveletMacTests
      gatherCoverageData: true
