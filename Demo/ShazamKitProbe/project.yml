name: ShazamKitProbe
options:
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.mythmedia.wavelet.shazamkitprobe
    PRODUCT_NAME: ShazamKitProbe
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: ShazamKit Probe
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "仅在你点击识别时，临时分析麦克风听到的声音以查找歌曲；不会保存录音。"
    CODE_SIGNING_ALLOWED: NO

targets:
  ShazamKitProbe:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mythmedia.wavelet.shazamkitprobe
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "仅在你点击识别时，临时分析麦克风听到的声音以查找歌曲；不会保存录音。"
        CODE_SIGN_ENTITLEMENTS: ShazamKitProbe.entitlements
